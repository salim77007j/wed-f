[package]
name = "wed_core"
version = "0.1.0"
edition = "2021"
description = "WED Browser privacy core: ad/tracker filter engine with cosmetic filtering"

[lib]
name = "wed_core"
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
